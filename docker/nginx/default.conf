# Sanitasi header proxy: jangan pernah menyampaikan nilai header klien
# secara mentah ke aplikasi (anti spoofing skema & IP).
# Hanya "https"/"http" yang diterima; nilai lain (atau tidak ada) -> $scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    "https" https;
    "http"  http;
}

# IP klien asli hanya diambil dari CF-Connecting-IP (di-set Cloudflare, tidak
# bisa dipalsukan klien). Tanpa Cloudflare fallback ke X-Forwarded-For.
map $http_cf_connecting_ip $forwarded_for {
    default $http_x_forwarded_for;
    "~^[0-9a-fA-F:.]+$" $http_cf_connecting_ip;
}

server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;

    # Aset hasil build Vite (filename berhash) — cache lama + immutable.
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # Berkas upload pengguna (storage:app/public) — jangan cache lama agar
    # hasil edit/unggah ulang tidak tersaji basi.
    location ^~ /storage/ {
        expires -1;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # Aset Livewire (livewire.js, source map) disajikan dinamis oleh Laravel —
    # jangan tertangkap blok statis di bawah (jika tertangkap, error_page 404
    # mewariskan status 404 padahal PHP sudah menyervis isinya, sehingga
    # browser menolak mengeksekusi JS dan Alpine tidak pernah boot).
    location ^~ /livewire/ {
        try_files $uri /index.php?$query_string;
    }

    # Aset statis lain (gambar, css/js legacy, font) — cache 7 hari.
    location ~* \.(?:css|js|mjs|webp|png|jpe?g|gif|svg|ico|woff2?|eot|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Teruskan header HTTP yang dibutuhkan aplikasi (fastcgi_params bawaan
        # TIDAK meneruskan header klien sama sekali: tanpa ini sesi/CSRF/login
        # selalu gagal 419 dan canonical/og:url jatuh ke "localhost").
        fastcgi_param  HTTP_HOST             $host;
        fastcgi_param  HTTP_COOKIE           $http_cookie;
        fastcgi_param  HTTP_REFERER          $http_referer;
        fastcgi_param  HTTP_ACCEPT           $http_accept;
        fastcgi_param  HTTP_ACCEPT_LANGUAGE   $http_accept_language;
        fastcgi_param  HTTP_ACCEPT_ENCODING   $http_accept_encoding;
        fastcgi_param  HTTP_ORIGIN           $http_origin;
        fastcgi_param  HTTP_AUTHORIZATION     $http_authorization;
        fastcgi_param  HTTP_X_REQUESTED_WITH  $http_x_requested_with;
        fastcgi_param  HTTP_X_CSRF_TOKEN      $http_x_csrf_token;
        fastcgi_param  HTTP_X_XSRF_TOKEN      $http_x_xsrf_token;

        # Header proxy tersanitasi (lihat map di atas).
        fastcgi_param X-Forwarded-Proto $forwarded_proto;
        fastcgi_param X-Forwarded-For   $forwarded_for;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    client_max_body_size 20M;
}
