server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;

    # Aset hasil build Vite (filename berhash) — cache lama + immutable.
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # Berkas upload pengguna (storage:app/public) — jangan cache lama agar
    # hasil edit/unggah ulang tidak tersaji basi.
    location ^~ /storage/ {
        expires -1;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # Aset Livewire (livewire.js, source map) disajikan dinamis oleh Laravel —
    # jangan tertangkap blok statis di bawah (jika tertangkap, error_page 404
    # mewariskan status 404 padahal PHP sudah menyervis isinya, sehingga
    # browser menolak mengeksekusi JS dan Alpine tidak pernah boot).
    location ^~ /livewire/ {
        try_files $uri /index.php?$query_string;
    }

    # Aset statis lain (gambar, css/js legacy, font) — cache 7 hari.
    location ~* \.(?:css|js|mjs|webp|png|jpe?g|gif|svg|ico|woff2?|eot|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    client_max_body_size 20M;
}
