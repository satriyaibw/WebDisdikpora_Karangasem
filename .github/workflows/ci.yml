name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Install Composer deps
        run: composer install --no-interaction --prefer-dist
      - name: Composer audit
        run: composer audit --format=json | php -r '$j=json_decode(file_get_contents("php://stdin"),true); $bad=[]; foreach(($j["advisories"]??[]) as $pkg=>$list){ foreach((array)$list as $a){ if(in_array($a["severity"]??"", ["high","critical"], true)) $bad[$pkg][]=$a; }} if($bad){ echo json_encode($bad, JSON_PRETTY_PRINT)."\n"; exit(1);} echo "No high/critical advisories\n";'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install NPM deps
        run: npm ci
      - name: NPM audit
        run: npm audit --audit-level=high || (echo "High/critical npm vulnerabilities found"; exit 1)
      - name: Build assets
        run: npm run build
      - name: Prepare env for tests
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
      - name: Run tests
        run: php artisan test
      - name: Pint check
        run: ./vendor/bin/pint --test
